# Site settings
title:                 Daniil Koshelyuk
email:                 daniil@polytope.solutions
description:           >
  Daniil Koshelyuk's student work in architecture, at MArchI and IAAC,
  2015-2018. Current work: Polytope Solutions, www.polytope.solutions.
# baseurl:             "daniil.koshelyuk.site" # the subpath of your site, e.g. /blog
url:                   daniil.koshelyuk.site # the base hostname & protocol for your site

# Build settings
markdown:              kramdown

sass:
  sass_dir:            "code/_sass"

include:               [
  "_data",
  "CNAME"
]

exclude:               [
  "code/css/*.scss",
  "node_modules",
  "gulpfile.js",
  "package.json",
  "package-lock.json",
  "README.md",
  "Gemfile",
  "Gemfile.lock",
  "build.sh",
  "_todo.txt",
  "vendor",
  "_data/**/*.yml"
]

# Git Hub Static Site Generator requirements
lsi:                   false
safe:                  true
incremental:           false
highlighter:           rouge
gist:
  noscript:            false
kramdown:
  math_engine:         mathjax
  syntax_highlighter:  rouge
