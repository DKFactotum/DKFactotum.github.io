Eng:
  intro:            "My name is <strong>Daniil Koshelyuk</strong>."
  paragraph:        "I am an architect by education and a developer by practice. Since 2019 I have worked as a freelance developer, now through <strong>Polytope Solutions</strong>: <strong>real-time 3D and XR</strong> applications in Unity, and <strong>tools that connect design software to devices</strong>. I have taught at the Institute for Advanced Architecture of Catalonia (IAAC) since 2018, and taught at IED Barcelona from 2019/20 to 2023/24."
  extras:           "This site shows my student work in architecture, at the Moscow Architectural Institute (MArchI) and IAAC, 2015–2018: the images, and some of the analytical and technical side of each project. My current work is at <a class='link' href='https://www.polytope.solutions'>www.polytope.solutions</a>."
  contact-intro:    "For work, collaborations or the use of any of this content, write to:"
