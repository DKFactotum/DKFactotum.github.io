  landing-work:     "Let's work together"
  intro:            "My name is <strong>Daniil Koshelyuk</strong>."
  paragraph:        "I am a real-time 3D and XR developer and educator, an architect by education with a background in programming. Since 2019 I have worked as a freelancer, now through <strong>Polytope Solutions</strong>, building Unity applications for startups and EU-funded research, mostly as the sole developer, from prototype to store release on iOS, Android, WebGL and immersive headsets: custom rendering and compute shaders, live geospatial data, multiplayer, native and web integration, and the headless services behind them. I also build tools that connect design software to devices, among them an open-source Grasshopper-to-AR platform."
  academia:         "I have taught at the Institute for Advanced Architecture of Catalonia (IAAC) since 2018, and taught at IED Barcelona from 2020 to 2024: Unity and C# from first steps to VR and AR, physical computing, computational design and immersive interaction, to design and architecture students."
  recently:         "More recently, lower-level systems and self-hosted infrastructure, and directing AI coding agents under my own design and review."
  extras:          "This site shows my student work in architecture, 2015–2018: the images, and some of the analytical and technical side of each project. My current work is at <a class='link' href='https://www.polytope.solutions/about.html?lang=Eng'>www.polytope.solutions</a>."
  contact-intro:   "To reach out, write to:"
  name:             "<strong>Daniil</strong><br>Koshelyuk"
  oneliner:         "implementing<br><strong>technologies</strong><br>in <strong>architecture</strong><br>investigating<br>and operating<br><strong>complex<br>systems</strong>"
