  landing-lead:     "Daniil Koshelyuk<br>trabaja a través de<br><strong>Polytope Solutions</strong><br>una práctica que desarrolla<br>3D en tiempo real y XR<br>crea herramientas que conectan<br>y enseña a otros a hacerlo también"
  landing-work:     "Trabajemos juntos"
  intro:            "Me llamo <strong>Daniil Koshelyuk</strong>."
  paragraph:        "Soy desarrollador de 3D en tiempo real y XR y docente, arquitecto de formación con base en programación. Desde 2019 trabajo como freelance, hoy a través de <strong>Polytope Solutions</strong>, desarrollando aplicaciones Unity para startups e investigación europea, casi siempre como único desarrollador, del prototipo a la publicación en tiendas en iOS, Android, WebGL y visores inmersivos: render a medida y compute shaders, datos geoespaciales en vivo, multijugador, integración nativa y web, y sus servicios headless. También desarrollo herramientas que conectan el software de diseño con los dispositivos, entre ellas una plataforma de código abierto de Grasshopper a AR."
  academia:         "Enseño en el Instituto de Arquitectura Avanzada de Cataluña (IAAC) desde 2018, y enseñé en el IED Barcelona de 2020 a 2024: Unity y C# desde cero hasta VR y AR, computación física, diseño computacional e interacción inmersiva, a estudiantes de diseño y arquitectura."
  recently:         "Más recientemente, sistemas de bajo nivel e infraestructura autoalojada: un NAS ARM64 sin documentación migrado de su firmware de fábrica a Linux mainline, con ingeniería inversa del SoC y port de sus drivers; un clúster Proxmox de dos nodos con más de diez servicios autoalojados; y un sistema de gestión de proyectos con una CLI en Python, construido con agentes de programación con IA bajo mi propio diseño y revisión, a partir de contratos acotados, con las decisiones registradas y resultados verificables. HoloFab, la plataforma de Grasshopper a AR, se está reescribiendo en Unity 6 y OpenXR."
  extras:          "Este sitio muestra mi trabajo de estudiante en arquitectura, 2015–2018: las imágenes y parte del lado analítico y técnico de cada proyecto. Mi trabajo actual está en <a class='link' href='https://www.polytope.solutions/about.html?lang=Esp'>www.polytope.solutions</a>."
  contact-intro:   "Para contactar, escríbame a:"
  name:             "<strong>Daniil</strong><br>Koshelyuk"
  oneliner:         "implementando<br><strong>tecnologías</strong><br>en la <strong>arquitectura</strong><br>investigando<br>y operando<br><strong>sistemas<br>complejos</strong>"
